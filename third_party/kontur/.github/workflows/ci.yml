name: CI

# push and pull_request cover different things and must not overlap:
# pull_request tests the *proposed merge* (GitHub builds head into base
# and runs against that), catching a change that only breaks once combined
# with what has landed since; push on main tests what actually landed,
# since two PRs that each pass alone can still conflict once both are in.
# Firing push on every branch instead would run this whole workflow twice
# for every push to a branch with a PR open -- image builds included.
on:
  push:
    branches: [main]
  pull_request:

# A branch pushed several times in a minute otherwise leaves earlier runs
# burning runners on commits nobody is waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # internal/netshim's integration tests create real interfaces and
      # tc filters, so they need CAP_NET_ADMIN and /dev/net/tun (the
      # netlink library opens that device to create a tap). The netlink
      # tap path needs the module present; it is normally already
      # loaded, and if it genuinely is not, the run below fails naming
      # the device rather than failing obscurely inside link creation.
      - name: load tun module
        run: sudo modprobe tun || true

      # Those tests skip when they cannot reach the kernel, and a package
      # whose every such test skipped still reports "ok" -- so the "test"
      # step above proves nothing about them. Re-run them as root with
      # KONTUR_NETNS_TESTS=required, which turns that silence into a
      # failure, so a runner that cannot exercise the kernel says so
      # instead of passing quietly.
      #
      # -count=1 is load-bearing: without it the unprivileged run's
      # cached "ok" for this package would be reused and nothing would
      # actually execute. sudo resets PATH, hence passing the runner's
      # own through so setup-go's toolchain is still found.
      #
      # Nothing here puts the tests in a namespace of their own: the test
      # binary does that itself, re-executing under CLONE_NEWNET before
      # the first test runs (see internal/netshim/netns_test.go), so the
      # interfaces below never appear in the runner's own namespace and
      # nothing else on the runner -- systemd-networkd, udev, docker --
      # is watching for them.
      - name: test (kernel networking, as root)
        run: sudo env "PATH=$PATH" KONTUR_NETNS_TESTS=required go test -count=1 ./internal/netshim/...

  # The image build is a separate job so it fails independently of the
  # Go tests and runs alongside them. It needs no privileges beyond an
  # ordinary `docker build`: the Dockerfile deliberately avoids `chroot`
  # (which would want CAP_SYS_ADMIN) by promoting the guest rootfs to an
  # image stage and using `mke2fs -d`, so there is nothing special to
  # arrange here.
  #
  # Every variant is built, not just the default. The Debian and Alpine
  # rootfs stages carry separate overlays and separate service-enabling
  # logic (see deploy/guest-image/README.md), so building only one leaves
  # the other's changes uncompiled -- and "debian12" exercises a third
  # path through the same Dockerfile that neither of those two reaches:
  # GUEST_KERNEL_PACKAGE, whose whole point is what happens to the
  # initramfs, and which fails in ways only a build reveals.
  #
  # On main these are published to GHCR. That is what makes a guest
  # something a consumer derives from rather than rebuilds: a customized
  # guest is this image, booted, provisioned and committed (see
  # "kontur guest build"), so the base has to exist somewhere pullable.
  # Never on pull_request -- publishing needs a credential, and running a
  # credentialed job against an unreviewed branch is exactly what this
  # workflow's own push-vs-pull_request split exists to avoid.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default guest: kontur's own minimal reference image,
          # booting the bundled cloud-hypervisor/linux kernel.
          - variant: debian
            moving_tag: latest
            build_args: |
              GUEST_DISTRO=debian
          - variant: alpine
            moving_tag: alpine
            build_args: |
              GUEST_DISTRO=alpine
          # A guest that can run containers and be driven
          # programmatically: Debian's own kernel (overlayfs, cgroup v2,
          # bridge netfilter, veth -- none of which a kernel built for
          # cloud-hypervisor's CI promises) and no console wrapper
          # forcing every "kontur exec" session through a pty. Same
          # rootfs as "debian"; the two differ only in those args.
          #
          # And disk headroom, because this is the variant published to
          # be derived from: "guest build" provisions a booted guest,
          # which cannot grow the filesystem it installs into.
          #
          # 2GB, not more, and the number is not comfort. A docker layer
          # materializes holes: `truncate` leaves the extra as a hole,
          # and the tar that carries it does not, so every GB here is a
          # GB extracted on every runner and every deployment host. 8GB
          # was tried first and made this job's outcome depend on how
          # much of the runner's ~14GB was free -- it passed once and
          # failed once on identical inputs.
          - variant: debian12
            moving_tag: debian12
            build_args: |
              GUEST_DISTRO=debian
              GUEST_KERNEL_PACKAGE=linux-image-amd64
              GUEST_DISK_EXTRA_MB=2048
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build fetches a pinned cloud-hypervisor release and kernel
      # and runs debootstrap/apk against distro mirrors, so it is slow
      # from cold. The layer cache is scoped per variant, since they
      # share every stage up to the rootfs and diverge after it.
      #
      # Both a moving tag and an immutable per-commit one: the moving tag
      # is what a human pulls, and the commit tag is what a consumer
      # pins, so a guest built on top of one keeps naming the exact base
      # it was built against even after the moving tag advances.
      - name: docker build (${{ matrix.variant }})
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: ${{ matrix.build_args }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.moving_tag }}
            ghcr.io/${{ github.repository }}:${{ matrix.variant }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  # Everything above is unit tests and image builds; neither boots a VM,
  # and the paths that only exist once one does are exactly the ones that
  # fail silently. A guest whose kernel handles "ip=" differently, or
  # whose initramfs renamed its NIC, does not fail to build -- it builds
  # perfectly and then never becomes reachable. So this boots the
  # container-capable variant for real, customizes it the way a consumer
  # would, and boots the result.
  #
  # GitHub's ubuntu runners provide /dev/kvm. The check below is not
  # ceremony: without it a runner that stopped providing it would turn
  # this job into a slow no-op that still reported success.
  guest-build:
    name: guest build under real KVM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Require KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not present on this runner, so nothing below would boot a VM. A green tick here would mean nothing." >&2
            exit 1
          fi
          ls -l /dev/kvm

      # This job builds a multi-gigabyte image, boots it, and commits
      # another one. A GitHub runner has roughly 14GB free and about
      # 20GB of preinstalled toolchains nothing here uses, so reclaiming
      # them is the difference between "fits" and "fits depending on how
      # much the cache happened to keep" -- which is what the debian12
      # image job looked like at 8GB of guest headroom: it passed once
      # and failed once on identical inputs. df is printed either side so
      # a future failure says how much room there actually was rather
      # than leaving it to be inferred.
      - name: Reclaim runner disk
        run: |
          echo "before:"; df -h /
          # Not $AGENT_TOOLSDIRECTORY: that is /opt/hostedtoolcache,
          # where actions/setup-go put the Go this job builds konturctl
          # with one step earlier. Deleting it reclaims a couple of GB
          # and costs the toolchain -- "go: command not found", exit
          # 127, from a step that has nothing to do with disk.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost || true
          echo "after:"; df -h /

      # The same variant the image job publishes, loaded into the local
      # daemon rather than pushed, and sharing that job's layer cache.
      # The same args the image job publishes this variant with, headroom
      # included -- the setup script below installs into the guest, which
      # is exactly what that headroom is for.
      - name: Build the debian12 guest image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            GUEST_DISTRO=debian
            GUEST_KERNEL_PACKAGE=linux-image-amd64
            GUEST_DISK_EXTRA_MB=2048
          load: true
          tags: kontur:debian12
          cache-from: type=gha,scope=debian12

      - name: Build konturctl
        run: go build -o konturctl ./cmd/konturctl

      # Every VM below is fronted by netshim, which creates a tap through
      # /dev/net/tun -- both the guest build's throwaway VM and the
      # verification boot after it. The module is normally already
      # loaded; loading it here means a runner where it genuinely is not
      # says so, rather than failing obscurely inside link creation with
      # a VM already half-created.
      - name: load tun module
        run: sudo modprobe tun || true

      # Deliberately does things a container build cannot: starts a
      # service, and records the machine-id it saw while running. The
      # second is what proves the scrub actually happened -- the
      # committed image's guest must come up with a *different* one, or
      # every VM cloned from it would share an identity.
      - name: Write a setup script
        run: |
          cat > setup.sh <<'EOF'
          set -eux
          systemctl is-system-running --wait || true
          systemctl start systemd-journald
          cat /etc/machine-id > /etc/kontur-build-machine-id
          echo provisioned > /etc/kontur-guest-build-ok
          # Installing something real is the point of provisioning a
          # booted guest, and it is what GUEST_DISK_EXTRA_MB exists for:
          # without headroom this fails with "You don't have enough free
          # space in /var/cache/apt/archives/" after a perfect boot.
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends build-essential
          EOF

      - name: konturctl guest build
        run: |
          ./konturctl guest build \
            -from kontur:debian12 \
            -setup ./setup.sh \
            -t kontur:debian12-customized

      # Boot what came out. This is the assertion that the whole chain
      # holds: a guest that got its address from "ip=" -- derived from
      # the sandbox's own interface, since that is the address the splice
      # hands the guest -- a kernel and initramfs the image carried, a
      # disk the commit captured, and an exec path that works without the
      # console wrapper.
      - name: Boot the customized guest and check it
        run: |
          set -euo pipefail
          # No -disk: the guest to boot is the one inside the image
          # being verified. No -disk-mode either: the default is the
          # overlay, and this boot is what proves that default is one a
          # guest actually comes up on -- it used to be readonly, which
          # a root filesystem cannot complete a boot from, and this step
          # passed -disk-readonly=false to work around it. -state-dir
          # because konturctl's default is /var/lib/kontur, which a
          # runner's unprivileged user cannot create; the create refuses
          # up front now rather than after a VM is already running, but
          # it still refuses.
          #
          # -disk-size-mb is comfortably larger than the image's own disk
          # (its rootfs plus GUEST_DISK_EXTRA_MB=2048), so the checks
          # below can tell a grown filesystem from the built one. It
          # costs the runner nothing: growing a qcow2's virtual size
          # allocates no clusters, and the guest only ever writes what it
          # writes.
          #
          # -wait is what makes this a create and not a create plus a
          # hand-written poll loop: it returns when the guest answers a
          # command, or fails early if the VM's container exits. This is
          # the only place that wait is exercised against a guest that
          # really boots.
          if ! ./konturctl vm create verify \
            -backend docker \
            -state-dir "$GITHUB_WORKSPACE/.kontur-state" \
            -kontur-image kontur:debian12-customized \
            -disk-size-mb 6144 \
            -guest-user root \
            -wait -ready-timeout 5m; then
            echo "::error::the customized guest never became reachable" >&2
            docker logs --tail 100 kontur-vm-verify >&2 || true
            exit 1
          fi
          # The standalone wait, against a guest that is already up: it
          # has to return promptly rather than wait out its timeout.
          ./konturctl vm wait verify \
            -state-dir "$GITHUB_WORKSPACE/.kontur-state" \
            -timeout 30s
          # The readiness signal itself, run exactly the way a pod spec's
          # readinessProbe runs it (absolute path, single attempt). Every
          # wait above goes through this, but only here is it the thing
          # being asserted rather than the thing being used.
          docker exec kontur-vm-verify /usr/local/bin/kontur ready -timeout 0
          echo "kontur ready answered for a booted guest"
          # The negative is the half that matters for a probe: a
          # container with no VM in it must not report ready, or a probe
          # that always exits zero would look exactly like a working one.
          # No netshim, no /dev/kvm, nothing -- so there is no vsock
          # socket to dial, let alone a guest behind it.
          if docker run --rm kontur:debian12-customized ready -timeout 0; then
            echo "::error::kontur ready exited zero in a container with no VM in it" >&2
            exit 1
          fi
          echo "kontur ready refuses a container with no guest in it"
          # And the same question asked without waiting for the answer to
          # be yes, which is what "vm status" is for: against a guest
          # that is up it has to agree with the wait and exit zero.
          ./konturctl vm status verify \
            -state-dir "$GITHUB_WORKSPACE/.kontur-state"
          # Through "konturctl vm exec" rather than the three-exec form
          # above, so the subcommand is checked against a real guest and
          # not only against a fake docker in the unit tests: it has to
          # find the VM's backend from -state-dir, name its container
          # itself, and hand back the guest command's own exit status.
          ./konturctl vm exec verify \
            -state-dir "$GITHUB_WORKSPACE/.kontur-state" \
            -- sh -c 'test -f /etc/kontur-guest-build-ok'
          echo "provisioning survived the commit"
          # A command that fails in the guest must come back as its own
          # status, not as konturctl's blanket 1 -- that is what makes
          # "vm exec" usable in a script at all.
          set +e
          ./konturctl vm exec verify \
            -state-dir "$GITHUB_WORKSPACE/.kontur-state" \
            -- sh -c 'exit 42'
          exec_status=$?
          set -e
          if [ "$exec_status" != "42" ]; then
            echo "::error::vm exec reported $exec_status for a guest command that exited 42" >&2
            exit 1
          fi
          echo "vm exec passed the guest command's exit status through"
          # stdin reaches the guest command, and stdout comes back
          # untouched: the README's Flow 4 pipelines are this property.
          echo hello-from-stdin | ./konturctl vm exec verify \
            -state-dir "$GITHUB_WORKSPACE/.kontur-state" \
            -- sh -c 'cat > /tmp/stdin-check'
          got=$(./konturctl vm exec verify \
            -state-dir "$GITHUB_WORKSPACE/.kontur-state" \
            -- cat /tmp/stdin-check)
          if [ "$got" != "hello-from-stdin" ]; then
            echo "::error::stdin/stdout through vm exec gave '$got'" >&2
            exit 1
          fi
          echo "vm exec proxied stdin and stdout byte for byte"
          # -w and -e against a real guest agent, which is the only place
          # the wire fields, the agent's own chdir and the flags
          # konturctl threads through "kontur exec" are all exercised
          # together. The unit tests run the agent on the build machine,
          # where an image whose kontur-agent predates these fields
          # cannot be told apart from one that has them.
          got=$(./konturctl vm exec verify \
            -state-dir "$GITHUB_WORKSPACE/.kontur-state" \
            -w /etc -e KONTUR_CI_CHECK=works \
            -- sh -c 'pwd; echo "$KONTUR_CI_CHECK"; echo "$HOME"' | tr '\n' ' ')
          if [ "$got" != "/etc works /root " ]; then
            echo "::error::vm exec -w/-e gave '$got', want '/etc works /root '" >&2
            exit 1
          fi
          echo "vm exec ran in the directory and environment it was given, without losing the rest of it"
          # A working directory the guest does not have has to be refused
          # by name, before the command runs -- the failure it replaces
          # is the shell's own "fork/exec /bin/sh: no such file or
          # directory", which reads as a guest with no shell.
          set +e
          err=$(docker exec kontur-vm-verify kontur exec -w /no/such/place -- true 2>&1)
          workdir_status=$?
          set -e
          if [ "$workdir_status" = "0" ] || ! grep -q "/no/such/place" <<<"$err"; then
            echo "::error::a missing working directory exited $workdir_status saying: $err" >&2
            exit 1
          fi
          echo "a working directory that is not there was refused by name"
          docker exec kontur-vm-verify kontur exec -- sh -c '
            built=$(cat /etc/kontur-build-machine-id)
            now=$(cat /etc/machine-id)
            test -n "$now"
            if [ "$built" = "$now" ]; then
              echo "machine-id $now survived the scrub; every VM from this image would share it" >&2
              exit 1
            fi'
          echo "the scrub reset the guest's identity"
          # The disk mode is not observable from inside the guest, but it
          # is from out here: `docker diff` lists what the container has
          # written into its own layer. In the default overlay mode that
          # is the qcow2 and never the image -- which is the whole point,
          # since a write to the image would copy all of it up first, on
          # every VM's first write. A regression here is silent and only
          # shows as VMs being slow to start.
          diff_out=$(docker diff kontur-vm-verify)
          echo "$diff_out"
          if ! grep -q "/var/lib/kontur/overlay" <<<"$diff_out"; then
            echo "::error::no overlay was created; the guest is writing somewhere else" >&2
            exit 1
          fi
          if grep -q "guest/disk.img" <<<"$diff_out"; then
            echo "::error::the guest disk image itself was copied up, so the overlay is not in use" >&2
            exit 1
          fi
          echo "the guest wrote into its overlay, not the image"
          # -disk-size-mb only sizes the block device; kontur-growfs in
          # the guest is what turns that into free space. Both halves are
          # checked, because the first one alone is what this used to do
          # and it looks like success from out here -- an 8GiB /dev/vda
          # with a few hundred MiB free reads as a working -disk-size-mb
          # right up until something in the guest runs out of room.
          docker exec kontur-vm-verify kontur exec -- sh -c '
            set -eu
            want_mb=6144
            dev_mb=$(( $(cat /sys/class/block/vda/size) / 2048 ))
            fs_mb=$(df -B1M --output=size / | tail -1 | tr -d " ")
            avail_mb=$(df -B1M --output=avail / | tail -1 | tr -d " ")
            echo "/dev/vda ${dev_mb}MiB, root filesystem ${fs_mb}MiB, ${avail_mb}MiB free"
            if [ "$dev_mb" -ne "$want_mb" ]; then
              echo "the block device is ${dev_mb}MiB, not the ${want_mb}MiB -disk-size-mb asked for" >&2
              exit 1
            fi
            # Only ext4 metadata should stand between the filesystem and
            # the whole device -- inode tables and journal, a couple of
            # percent. 10% is slack for that, and still nowhere near the
            # ~3GB the image was built with, which is what an ungrown
            # filesystem would report.
            if [ "$fs_mb" -lt "$(( want_mb - want_mb / 10 ))" ]; then
              echo "the root filesystem is ${fs_mb}MiB of a ${dev_mb}MiB disk: kontur-growfs did not grow it" >&2
              exit 1
            fi
            if [ "$avail_mb" -lt 2048 ]; then
              echo "only ${avail_mb}MiB free on a ${dev_mb}MiB disk" >&2
              exit 1
            fi'
          echo "the guest grew its filesystem onto the disk it was given"

      # The guest is supposed to end up with the *container's* own
      # routing table, not one inferred from its netmask -- which is a
      # claim about two tables being equal, and neither of them exists
      # until a VM has really booted behind a real netshim. The unit
      # tests derive one from a dump and apply the other to a fake "ip";
      # this compares what the guest actually has against what the
      # sandbox actually has.
      #
      # docker's network is a bridge, so the two tables were already
      # equal before any of this existed. That is the point: this is the
      # case that must not change, and the one CI can reach. The
      # point-to-point case it exists for (a "10.244.0.0/24 via
      # <gateway>" that no netmask can express) needs a ptp CNI, i.e. a
      # cluster.
      #
      # The sandbox's side is read with nsenter rather than from inside
      # the VM container, which is a "scratch" image with no iproute2 in
      # it. Both tables are reduced to destination and gateway: the
      # kernel decorates its own with "proto kernel" and a preferred
      # source that the guest's copy has no reason to carry.
      - name: Check the guest has the container's own routes
        run: |
          set -euo pipefail
          strip() { awk '{ gw=""; for (i=2; i<NF; i++) if ($i == "via") gw=$(i+1); print $1 (gw == "" ? "" : " via " gw) }' | sort; }

          # The unit that installs them has to have run and succeeded.
          # Asserted separately because the comparison below cannot see
          # it: on docker's bridge the "ip=" parameter alone already
          # produces the right table, so a unit that never ran would
          # still match.
          #
          # Waited for rather than sampled, because "kontur exec" answers
          # over vsock from early in the boot -- deliberately, it is what
          # a guest whose boot went wrong is reached with -- so every
          # step in this job before this one can and does run while the
          # guest is still in sysinit. Asking a booting guest whether a
          # sysinit-era unit has finished is a coin toss, and this used
          # to lose it.
          state=""
          for _ in $(seq 1 60); do
            state=$(docker exec kontur-vm-verify kontur exec -- systemctl is-active kontur-net-routes.service || true)
            case "$state" in
              active|failed) break ;;
            esac
            sleep 2
          done
          if [ "$state" != "active" ]; then
            echo "::error::kontur-net-routes.service is $state, not active" >&2
            docker exec kontur-vm-verify kontur exec -- systemctl status --no-pager kontur-net-routes.service >&2 || true
            exit 1
          fi

          pid=$(docker inspect -f '{{.State.Pid}}' kontur-vm-verify)
          # "ip" lives in /usr/sbin, which is not on the PATH a guest
          # session gets -- internal/agent's defaultPATH reproduces
          # sshd's, deliberately.
          sudo nsenter -t "$pid" -n ip -4 route show dev eth0 > sandbox.routes
          docker exec kontur-vm-verify kontur exec -- \
            sh -c 'PATH=/usr/sbin:/sbin:$PATH; ip -4 route show dev eth0' > guest.routes
          echo "the sandbox's own table:"; cat sandbox.routes
          echo "the guest's table:"; cat guest.routes

          sandbox=$(strip < sandbox.routes)
          guest=$(strip < guest.routes)
          if [ -z "$sandbox" ]; then
            echo "::error::the sandbox has no routes on eth0, so this proves nothing" >&2
            exit 1
          fi
          if [ "$sandbox" != "$guest" ]; then
            echo "::error::the guest's routing table is not the container's" >&2
            diff <(echo "$sandbox") <(echo "$guest") >&2 || true
            docker logs --tail 50 kontur-vm-verify >&2 || true
            exit 1
          fi
          echo "the guest routes exactly as its container does"

      # "kontur cp" is a claim about bytes surviving a round trip, and
      # the unit tests make it against a shell on the build machine
      # rather than a guest across a vsock. This is the same claim
      # against a real VM: a megabyte of random binary in and back out
      # again, compared byte for byte, and a directory through the tar
      # path both ways. Random rather than text on purpose -- text is
      # what the old hand-built pipelines got right.
      - name: Copy files in and out with kontur cp
        run: |
          set -euo pipefail
          head -c 1048576 /dev/urandom > blob.bin
          docker exec -i kontur-vm-verify kontur cp - /root/blob.bin < blob.bin
          want=$(sha256sum blob.bin | cut -d' ' -f1)
          got=$(docker exec kontur-vm-verify kontur exec -- sha256sum /root/blob.bin | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "::error::the file arrived in the guest as $got, not $want" >&2
            exit 1
          fi
          echo "a binary file copied into the guest intact"

          docker exec kontur-vm-verify kontur cp /root/blob.bin - > blob.out
          cmp blob.bin blob.out
          echo "and came back out intact"

          mkdir -p tree/nested
          cp blob.bin tree/nested/blob.bin
          echo hello > tree/top.txt
          tar -cf - -C tree . | docker exec -i kontur-vm-verify kontur cp -tar - /srv/tree
          docker exec kontur-vm-verify kontur cp -tar /srv/tree - > tree.tar
          mkdir restored
          tar -xf tree.tar -C restored
          cmp blob.bin restored/nested/blob.bin
          test "$(cat restored/top.txt)" = "hello"
          echo "a directory round-tripped through the tar path"

          # And a pack that fails has to fail. The guest-side command is
          # "tar | base64", whose status is base64's -- and base64
          # succeeds on the empty input a tar that could not open its
          # directory leaves it, so this wrote an empty archive and
          # exited 0. Asserted here as well as in the unit tests because
          # it depends on the guest's own shell rather than on the build
          # machine's.
          set +e
          docker exec kontur-vm-verify kontur cp -tar /srv/not-there - > empty.tar
          pack_status=$?
          set -e
          if [ "$pack_status" = "0" ]; then
            echo "::error::packing a directory that does not exist reported success, writing $(wc -c < empty.tar) bytes" >&2
            exit 1
          fi
          echo "a pack of a directory that is not there fails rather than writing an empty archive"

      # The other half of what "vm status" is for: a VM that is not going
      # to become ready has to be reported as such straight away, rather
      # than looking like one that is merely slow. Last of the steps that
      # use this VM, because it stops it.
      - name: konturctl vm status on a stopped VM
        run: |
          set -euo pipefail
          state="$GITHUB_WORKSPACE/.kontur-state"
          docker stop kontur-vm-verify >/dev/null
          set +e
          out=$(./konturctl vm status verify -state-dir "$state")
          status=$?
          set -e
          echo "$out"
          if [ "$status" = "0" ]; then
            echo "::error::vm status exited zero for a VM whose container is stopped" >&2
            exit 1
          fi
          case "$out" in
            *"not running"*) ;;
            *) echo "::error::vm status did not say the container is not running" >&2; exit 1 ;;
          esac
          echo "vm status answers for a stopped VM without waiting for it"

      # The one-off flow, which is the same guest reached a different
      # way: no create, no polling loop and no delete on this side, since
      # "vm run" does all three. Worth its own step because it is the
      # only place the readiness wait is exercised for real -- a fake
      # docker can say the guest answered, it cannot say when.
      - name: One-off VM with konturctl vm run
        run: |
          set -euo pipefail
          state="$GITHUB_WORKSPACE/.kontur-state"
          # Only the guest command's own bytes may land on stdout: every
          # progress line "vm run" prints goes to stderr, or capturing
          # its output like this would be useless.
          out=$(./konturctl vm run oneoff \
            -state-dir "$state" \
            -kontur-image kontur:debian12-customized \
            -ready-timeout 5m \
            -- cat /etc/kontur-guest-build-ok)
          if [ "$out" != "provisioned" ]; then
            echo "::error::vm run printed '$out', want the file's contents alone" >&2
            exit 1
          fi
          echo "vm run booted a VM, ran one command and gave back its output"

          set +e
          ./konturctl vm run oneoff2 \
            -state-dir "$state" \
            -kontur-image kontur:debian12-customized \
            -ready-timeout 5m \
            -- sh -c 'exit 42'
          run_status=$?
          set -e
          if [ "$run_status" != "42" ]; then
            echo "::error::vm run reported $run_status for a guest command that exited 42" >&2
            exit 1
          fi

          # Both VMs are gone, the failing one included: a non-zero
          # command is a result, not a reason to leave a container, a tap
          # device and an overlay behind.
          ./konturctl vm list -state-dir "$state"
          if ./konturctl vm list -state-dir "$state" | grep -q oneoff; then
            echo "::error::vm run left saved state behind" >&2
            exit 1
          fi
          if docker ps -a --format '{{.Names}}' | grep -q kontur-vm-oneoff; then
            echo "::error::vm run left containers behind" >&2
            docker ps -a >&2
            exit 1
          fi
          echo "vm run cleaned up after both commands"

      - name: Guest console on failure
        if: failure()
        run: |
          docker logs --tail 200 kontur-vm-verify || true
          docker logs --tail 200 kontur-vm-oneoff || true
          docker logs --tail 200 kontur-vm-oneoff2 || true

      # Last, so it is the end of the log and not buried in the console
      # dump above. Networking is the half of a guest that fails without
      # failing to boot -- an address that works and routes that do not
      # look identical from out here -- so when something in this job
      # goes wrong, what the two sides of the splice actually have is
      # worth a few lines.
      - name: Guest networking on failure
        if: failure()
        continue-on-error: true
        run: |
          set +e
          echo "== the VM container's own namespace"
          pid=$(docker inspect -f '{{.State.Pid}}' kontur-vm-verify)
          sudo nsenter -t "$pid" -n ip -4 addr show
          sudo nsenter -t "$pid" -n ip -4 route show
          echo "== what kontur run derived for the guest"
          docker logs kontur-vm-verify 2>&1 | grep -E "guest takes over|route\(s\)|CHV_CMDLINE" | tail -5
          echo "== the guest's own view"
          docker exec kontur-vm-verify kontur exec -- cat /proc/cmdline
          docker exec kontur-vm-verify kontur exec -- \
            sh -c 'PATH=/usr/sbin:/sbin:$PATH; ip -4 addr show dev eth0; ip -4 route show'
          docker exec kontur-vm-verify kontur exec -- \
            systemctl --no-pager --full status kontur-net-cmdline.service kontur-net-routes.service
          docker exec kontur-vm-verify kontur exec -- systemctl --no-pager list-jobs
