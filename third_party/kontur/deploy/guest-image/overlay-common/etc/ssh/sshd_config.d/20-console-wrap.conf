# Every SSH session on this guest -- an interactive shell, or an explicit
# `ssh host cmd` -- is wrapped so its output is also mirrored onto the
# guest's serial console (ttyS0), in addition to reaching the actual SSH
# client. ttyS0 is the only thing kontur exposes outside the VM (its "run"
# mode streams it straight to the container's own stdout/stderr, i.e.
# `kubectl logs`), so this is what makes SSH activity observable there
# without a separate log shipper inside the guest. See
# /usr/local/libexec/kontur-ssh-console-wrap.
#
# It is a separate drop-in, rather than part of 10-console.conf, because
# it is not free: the wrapper runs each command under `script`, i.e.
# under a pty, and a pty is not a transparent pipe. Measured against this
# wrapper, output newlines come back as CRLF and stdout and stderr are
# merged onto the one stream -- so a caller that reads a file or reports
# stderr separately over `kontur exec` gets corrupted content and empty
# error messages. (Exit status and stdin both survive: `script --return`
# propagates the status, and input passes through byte for byte.)
#
# Build with GUEST_CONSOLE_WRAP=0 to leave this file out and get an
# unwrapped, byte-transparent session instead, at the cost of SSH
# activity no longer appearing on the console. A guest driven
# programmatically -- anything parsing command output rather than a human
# reading it -- wants that.
ForceCommand /usr/local/libexec/kontur-ssh-console-wrap
