# Push to main -> the deployment converges. Nothing in this workflow logs
# into the host: Terraform reconciles the GCP side, the two secrets go
# straight into the instance's own metadata, and the new commit SHA lands
# there too -- which is what the on-VM config-sync service is watching.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  # Uncomment to also redeploy on a schedule, which is how you track a
  # moving grain_ref (e.g. "main") without pushing to this repo.
  # schedule:
  #   - cron: "17 6 * * *"

# One rollout at a time. Never cancel one in flight: it is mid-apply.
concurrency:
  group: grain-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for keyless auth to GCP
  issues: write # to create the three labels the task queue runs on

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # The token the host watches for. A commit SHA for a push; SHA + run
      # id for a manual or scheduled run, so "redeploy now" always takes.
      DEPLOY_GENERATION: ${{ github.event_name == 'push' && github.sha || format('{0}-{1}', github.sha, github.run_id) }}
      TF_IN_AUTOMATION: "true"
      # A step's `if:` can't see the secrets context at all (GitHub
      # rejects it at parse time: "Unrecognized named-value: 'secrets'") --
      # only env, vars and a handful of others. jobs.<job_id>.env can see
      # secrets, so the WIF-vs-key branch has to happen here and get
      # checked via env below instead of inline.
      HAS_WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}

    steps:
      - uses: actions/checkout@v4

      # This repo is also the task queue: an issue here, labelled
      # `grain-agent`, is what the automation service picks up. Create the
      # three labels it moves an issue between, so they are in the picker
      # before anyone files the first task.
      - name: Ensure the task labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          label() {
            gh label create "$1" --repo "${{ github.repository }}" \
              --color "$2" --description "$3" 2>/dev/null \
              && echo "created $1" || echo "$1 already exists"
          }
          label grain-agent 0e8a16 "Hand this task to the agent set"
          label grain-agent-in-progress fbca04 "An agent is working on this"
          label grain-agent-awaiting-reply d93f0b "Parked: the agent needs a human reply"

      # Preferred: Workload Identity Federation, so this repo holds no GCP
      # key at all. scripts/bootstrap-gcp.sh sets it up and prints both values.
      - name: Authenticate to GCP (workload identity)
        if: ${{ env.HAS_WIF == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      # Fallback for projects that cannot use WIF. A long-lived key in a
      # GitHub secret is strictly worse; prefer the step above.
      - name: Authenticate to GCP (service account key)
        if: ${{ env.HAS_WIF != 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -backend-config=../config/backend.hcl

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate -no-color

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply -input=false -auto-approve -no-color \
            -var-file=../config/grain.tfvars \
            -var="config_repo=${{ github.repository }}" \
            -var="deploy_generation=${DEPLOY_GENERATION}"

      - name: Read outputs
        id: tf
        working-directory: terraform
        run: |
          {
            echo "project_id=$(terraform output -raw project_id)"
            echo "instance=$(terraform output -raw instance_name)"
            echo "zone=$(terraform output -raw zone)"
          } >> "$GITHUB_OUTPUT"

      # The only place a secret value is ever decrypted. It goes straight
      # into the instance's own metadata over the Compute API -- never
      # through Secret Manager, so the deployer needs no project-wide
      # secret access, and never through Terraform, so it is not in the
      # state file. The host reads it back locally, with no GCP
      # credential at all: metadata is local to the instance that owns it.
      - name: Push secrets to the host
        env:
          PROJECT: ${{ steps.tf.outputs.project_id }}
          INSTANCE: ${{ steps.tf.outputs.instance }}
          ZONE: ${{ steps.tf.outputs.zone }}
          GRAIN_GITHUB_TOKEN: ${{ secrets.GRAIN_GITHUB_TOKEN }}
          GRAIN_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.GRAIN_CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          push_secret() {
            local key="$1" value="$2" tmp
            if [ -z "$value" ]; then
              echo "::warning::$key is empty; leaving the host's copy untouched"
              return 0
            fi
            tmp="$(mktemp)"
            umask 077
            printf '%s' "$value" > "$tmp"
            gcloud compute instances add-metadata "$INSTANCE" \
              --project="$PROJECT" --zone="$ZONE" \
              --metadata-from-file="$key=$tmp" >/dev/null
            rm -f "$tmp"
            echo "$key: pushed"
          }

          push_secret "grain-github-token" "$GRAIN_GITHUB_TOKEN"
          push_secret "grain-claude-token" "$GRAIN_CLAUDE_CODE_OAUTH_TOKEN"

      # The host reports progress through guest attributes, so CI fails
      # when the rollout fails rather than when `terraform apply` returns.
      - name: Wait for the host to converge
        env:
          PROJECT: ${{ steps.tf.outputs.project_id }}
          INSTANCE: ${{ steps.tf.outputs.instance }}
          ZONE: ${{ steps.tf.outputs.zone }}
          TIMEOUT_MINUTES: ${{ vars.ROLLOUT_TIMEOUT_MINUTES || '45' }}
        run: |
          set -euo pipefail

          attr() {
            gcloud compute instances get-guest-attributes "$INSTANCE" \
              --project="$PROJECT" --zone="$ZONE" --query-path="grain/$1" \
              --format='value(value)' 2>/dev/null || true
          }

          deadline=$(( SECONDS + TIMEOUT_MINUTES * 60 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status="$(attr deploy-status)"
            generation="$(attr deploy-generation)"
            if [ "$generation" = "$DEPLOY_GENERATION" ]; then
              case "$status" in
                ok)
                  echo "host converged on $DEPLOY_GENERATION"
                  exit 0
                  ;;
                failed)
                  echo "::error::deploy failed on the host: $(attr deploy-detail)"
                  echo "Inspect it with:"
                  echo "  gcloud compute ssh $INSTANCE --zone $ZONE --project $PROJECT --tunnel-through-iap \\"
                  echo "    --command 'sudo journalctl -u grain-config-sync -n 200 --no-pager'"
                  exit 1
                  ;;
              esac
            fi
            echo "waiting: generation=${generation:-none} status=${status:-none}"
            sleep 20
          done

          echo "::error::host did not report success within ${TIMEOUT_MINUTES}m"
          echo "A first deploy downloads a base image and boots several VMs;"
          echo "raise the ROLLOUT_TIMEOUT_MINUTES repository variable if it is just slow."
          exit 1

      - name: Summary
        if: always()
        working-directory: terraform
        run: |
          {
            echo "### grain rollout"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| generation | \`${DEPLOY_GENERATION}\` |"
            echo "| instance | \`$(terraform output -raw instance_name 2>/dev/null || echo unknown)\` |"
            echo "| host service account | \`$(terraform output -raw host_service_account 2>/dev/null || echo unknown)\` |"
            echo "| ssh | \`$(terraform output -raw ssh_command 2>/dev/null || echo unknown)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
