# Builds grain's release artifacts on every checkin and stores them in
# GitHub, so a deployment (or an operator poking around) can fetch a
# known-good build without having to check out the repo and run a
# toolchain locally -- bwsalmon/agents#622, #645.
#
# Two artifacts, both container images, both to GHCR:
#
#   - the grain image (Dockerfile): `grain` plus every binary it shells
#     out to -- git, the docker CLI, konturctl, the claude and agy CLIs --
#     in one image scripts/setup.sh pulls instead of building anything on
#     the deployed host.
#   - the default sandbox container: the generic kontur OCI image
#     (scripts/kontur/build-oci-image.sh) a kontur-backed deployment runs
#     to get the kontur binaries and a pinned cloud-hypervisor release,
#     built with no guest-specific customization -- see that script's own
#     comment ("The image this produces is deliberately generic"). Its
#     per-commit tag is stamped into the grain image built from that same
#     commit, which is how a deployment knows which sandbox goes with the
#     grain it is running without being told (bwsalmon/agents#645).
#
# There is deliberately no release of bare binaries any more. This
# workflow used to publish `grain` and the three kontur binaries as
# assets on a rolling `build-latest` GitHub Release, from the era when a
# host built or fetched a binary and ran it directly. A deployment has
# not worked that way since bwsalmon/agents#645: setup.sh pulls the image
# and installs wrappers that exec into it, konturctl included, and the
# kontur binaries a sandbox needs are inside the sandbox image. Nothing
# in this repository or in a deployment ever downloaded those assets, so
# they were a second, unversioned answer to "what is the release" that
# could silently drift from the image everything actually runs.
#
# Deliberately not published here either: the guest VM disk
# (scripts/kontur/build-guest.sh's disk.img/vmlinuz/initrd.img) is a
# per-deployment build (it bakes in an operator's own SSH key, and
# optionally SANDBOX_SETUP_SCRIPT) rather than a single generic one this
# workflow could publish for everybody, and that script's existing
# KONTUR_IMAGE_BUCKET publishing path -- a deployment's own GCS bucket --
# already covers it. "The default sandbox container" above is the OCI
# image, not that disk; see build-oci-image.sh's doc comment for how the
# two relate.
#
# Images go to GHCR -- GitHub's own registry, so still "in github" --
# tagged with the commit's short SHA, the branch, and (on main) `latest`.
# A registry, unlike Releases, makes keeping prior tags around free and
# gives a rollback target a single rolling release never had.
#
# push, not pull_request: publishing needs a GITHUB_TOKEN with
# packages:write, and running that against an unreviewed PR branch is
# exactly what ../tests.yml's own comment on pull_request-vs-push warns
# against for a job that holds a credential. A `push` event only ever
# fires for a branch in this repository, which takes write access to
# create -- a fork's PR branch never triggers one -- so publishing per
# branch does not widen who can make a credentialed job run. The one
# *shared* name that every deployment resolves, `latest`, stays main's:
# a branch push publishes its own tags and moves nothing anyone else
# resolves.
name: build-artifacts

on:
  push:
    # Every branch, tags excluded: an image is published per branch (the
    # grain-container job below), and a tag push would otherwise publish
    # one under the tag's own name, which nothing here or in
    # scripts/setup.sh ever resolves.
    branches: ['**']

permissions:
  contents: read

# One publish at a time, in commit order, and never cancelled -- two
# pushes racing to overwrite the same :latest tag could otherwise leave
# it holding whichever run happened to finish first rather than
# whichever commit is actually newest. Same reasoning ../tests.yml gives
# for never cancelling a push-to-main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sandbox-container:
    name: sandbox container (kontur OCI image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # build-oci-image.sh is the same script an operator publishing to
      # their own registry would run (KONTUR_OCI_SKIP_PUSH unset here, so
      # it pushes); this just points KONTUR_OCI_IMAGE at GHCR instead of
      # a project's Artifact Registry. Tagged with the commit's short SHA
      # first, then re-tagged below from the already-built local image,
      # rather than building twice.
      #
      # Every branch, not main only, since bwsalmon/agents#645: the grain
      # image built from this same commit has *this* reference stamped
      # into it (grain-container below passes it as --build-arg
      # SANDBOX_IMAGE), and a deployment running that grain resolves the
      # sandbox by that exact tag. A sandbox published on main alone
      # would leave every branch build naming an image that does not
      # exist.
      - name: Build and push (commit tag)
        id: build
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/kontur-sandbox:sha-${short_sha}"
          KONTUR_OCI_SOURCE_REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            KONTUR_OCI_IMAGE="$image" ./scripts/kontur/build-oci-image.sh
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # The branch tag, and -- on main alone -- `latest`. Same split, and
      # the same reasoning, as grain-container's own three names: a
      # shared name that every kontur deployment resolves is main's to
      # move, and nobody else's.
      - name: Tag and push
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/kontur-sandbox"
          branch_tag="${GITHUB_REF_NAME//\//-}"
          docker tag "${{ steps.build.outputs.image }}" "${image}:${branch_tag}"
          docker push "${image}:${branch_tag}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "${{ steps.build.outputs.image }}" "${image}:latest"
            docker push "${image}:latest"
          fi

  grain-container:
    name: grain container
    # The sandbox container this image will name has to exist before this
    # one is published: `grain sandbox-image` out of the published image
    # is what scripts/setup.sh pulls and what an upgrade pulls
    # alongside it, so publishing a grain that names a tag no job ever
    # pushed would be publishing a deployment that cannot dispatch.
    needs: sandbox-container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Built before logging in, and published only after the e2e suite
      # below has driven it: a credential is held for the shortest span
      # that gets the image pushed, and an image that does not come up is
      # never a tag some deployment might pull. `make image` is the
      # same target a laptop runs (see that Makefile's own `image`
      # comment), so what CI publishes and what a developer builds come
      # from one copy of the build rules -- no marketplace build action.
      #
      # SANDBOX_IMAGE stamps the sandbox container built from this same
      # commit into the binary (cmd/grain/sandboximage.go), which is what
      # lets a deployment need no configuration for it at all -- and what
      # makes a rollback to an older grain ask for its own older sandbox
      # rather than today's. It names the immutable sha- tag, never the
      # branch tag, for exactly that reason.
      - name: Build the image
        id: build
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/grain"
          sandbox="ghcr.io/${GITHUB_REPOSITORY,,}/kontur-sandbox:sha-${GITHUB_SHA:0:7}"
          make image IMAGE="${image}:sha-${GITHUB_SHA:0:7}" SANDBOX_IMAGE="$sandbox"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "sandbox=$sandbox" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # tests/container actually runs the image just built: it starts the
      # daemon the way scripts/setup.sh's own unit starts it, drives the
      # API and the CLI against it, and exercises the two host-facing
      # mechanisms that only exist because grain is in a container -- the
      # control files behind the reboot/restart buttons, and an upgrade
      # pulling a tag out of a throwaway local registry. Every test in it
      # skips itself without GRAIN_TEST_IMAGE, which is why ../tests.yml's
      # own `go test ./...` only compiles it and this job is the one that
      # runs it.
      #
      # -count=1 so a cached "ok" from a run where they all skipped can
      # never stand in for a real one, and -v because when a container
      # fails to come up the per-step log is the only account of how far it
      # got.
      #
      # A runner has what all of that needs and a hosted PR job does not
      # have to be trusted with: a docker daemon, systemd, and passwordless
      # sudo. Nothing here holds the GHCR credential yet -- the login below
      # is deliberately after this step.
      - name: Run the container e2e suite
        env:
          GRAIN_TEST_IMAGE: ${{ steps.build.outputs.image }}:${{ steps.build.outputs.tag }}
        run: go test ./tests/container/... -count=1 -v -timeout 30m

      # tests/installer runs scripts/setup.sh itself, as root, against this
      # runner: a real system user, real units in /etc/systemd/system, a
      # real service. That is destructive, which is why it takes an
      # explicit GRAIN_INSTALLER_E2E=1 and skips everywhere else -- and it
      # is the point, because the failure it exists for (a deploy dying
      # between pulling the image and writing the unit) is invisible to
      # anything that only drives the image.
      #
      # Last, and separate from the suite above: it takes over
      # /usr/local/bin/grain and the daemon unit for the length of the run,
      # so nothing after it on this runner should expect either to be
      # untouched.
      - name: Run the installer e2e suite
        env:
          GRAIN_TEST_IMAGE: ${{ steps.build.outputs.image }}:${{ steps.build.outputs.tag }}
          GRAIN_INSTALLER_E2E: "1"
        run: go test ./tests/installer/... -count=1 -v -timeout 30m

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Three names for one image, each answering a different question.
      #
      #   sha-<short>  what exactly is running -- immutable, and the only
      #                tag that can never be moved out from under a
      #                deployment pinned to it
      #   <branch>     what this branch is at now: the tag
      #                scripts/setup.sh resolves from GRAIN_REF, and
      #                the one the UI's Upgrade button pulls when an
      #                operator names a branch (pkg/upgrade's
      #                TagForBranch). '/' is not legal in a docker tag,
      #                so it becomes '-' -- the same substitution
      #                TagForBranch makes, and the reason it is written
      #                down in both places rather than derived once
      #   latest       main's own branch tag under the name a human
      #                types, published on main alone
      - name: Push
        run: |
          set -euo pipefail
          image="${{ steps.build.outputs.image }}"
          sha_tag="${{ steps.build.outputs.tag }}"
          branch_tag="${GITHUB_REF_NAME//\//-}"
          docker tag "${image}:${sha_tag}" "${image}:${branch_tag}"
          docker push "${image}:${sha_tag}"
          docker push "${image}:${branch_tag}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "${image}:${sha_tag}" "${image}:latest"
            docker push "${image}:latest"
          fi
          echo "published ${image}:${sha_tag} and ${image}:${branch_tag}"
