# This is a reference/demo guest image: root login is key-only and there
# is no password set at all, so PasswordAuthentication is disabled
# outright rather than merely discouraged.
#
# The console mirroring that used to be configured here lives in
# 20-console-wrap.conf beside this file, which GUEST_CONSOLE_WRAP=0
# removes at build time. See that file, and the guest-image README's "Why
# SSH output goes to the console".
PermitRootLogin prohibit-password
PasswordAuthentication no
