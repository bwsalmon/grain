# TEMPORARY probe job for task 255 -- delete before this branch merges.
#
# Round 3. A dummy GEMINI_API_KEY gets past the startup check that stopped
# round 2, so `-p /permissions` and `-p /config` answer (agy's changelog:
# those are answered in print mode without an agent turn), and a
# stream-json run gets far enough to emit its `init` event -- which carries
# the advertised native tool roster and the permission mode -- before the
# model call fails on the bogus key. Comparing that roster with and without
# a permissions block in settings.json is the question this job exists for.
name: agy-probe

on:
  push:
    branches: [grain/task-255]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: probe agy permissions schema
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install the agy CLI
        run: |
          set -euo pipefail
          curl -fsSL --max-time 180 https://antigravity.google/cli/install.sh -o /tmp/agy-install.sh
          test -s /tmp/agy-install.sh
          bash /tmp/agy-install.sh
          rm -f /tmp/agy-install.sh
          agy="$(find "$HOME" -type f -name agy -perm -u+x 2>/dev/null | head -n1 || true)"
          test -n "$agy"
          sudo ln -sf "$agy" /usr/local/bin/agy
          echo "AGY_BIN=$agy" >> "$GITHUB_ENV"
          agy --version

      - name: Type names
        run: |
          set +e +o pipefail
          out=/tmp/agy-evidence
          rm -rf "$out"; mkdir -p "$out"
          agy --version > "$out"/version.txt 2>&1
          strings -n 4 "$AGY_BIN" > /tmp/agy.strings
          grep -aoE '(permissions|settings|permission|config|printmode)\.[A-Za-z_][A-Za-z0-9_]*' /tmp/agy.strings \
            | sort -u > "$out"/type-names.txt
          grep -aoE '\*?permissions\.[A-Za-z_][A-Za-z0-9_]*' /tmp/agy.strings | sort -u > "$out"/permissions-types.txt
          grep -a -iE 'allow.?rule|allowlist|deny|prohibit|not allowed|soft.?den' /tmp/agy.strings \
            | grep -aiE '[a-z] [a-z]' | sort -u > "$out"/denial-prose.txt
          grep -a -iE 'skip.?permission|dangerously|auto.?approve|bypass' /tmp/agy.strings | sort -u > "$out"/skip-strings.txt

      - name: Print-mode answers, with a dummy key
        env:
          GEMINI_API_KEY: not-a-real-key-probe-only
        run: |
          set +e +o pipefail
          out=/tmp/agy-evidence
          deny='{"modelProvider":"gemini","permissions":{"allow":["mcp_grain-sandbox_*"],"deny":["run_command(*)","view_file(*)","write_to_file(*)"]}}'

          probe() { # $1 label, $2 settings, rest = extra flags
            local label="$1" settings="$2"; shift 2
            local h="/tmp/home-$label"
            rm -rf "$h"; mkdir -p "$h/.gemini/antigravity-cli" "$h/.gemini/config"
            printf '%s' "$settings" > "$h/.gemini/antigravity-cli/settings.json"
            echo '{"mcpServers":{}}' > "$h/.gemini/config/mcp_config.json"
            {
              echo "########## $label   (flags: $*)"
              echo "--- settings in:"; cat "$h/.gemini/antigravity-cli/settings.json"; echo
              for cmd in /permissions /config; do
                echo "--- -p $cmd (text)"
                ( cd /tmp && HOME="$h" timeout 90 agy "$@" -p "$cmd" 2>&1 | head -60 )
                echo "--- -p $cmd (json)"
                ( cd /tmp && HOME="$h" timeout 90 agy "$@" --output-format json -p "$cmd" 2>&1 | head -60 )
              done
              echo "--- settings out:"; cat "$h/.gemini/antigravity-cli/settings.json"; echo
            } >> "$out"/print-mode.txt 2>&1
          }
          probe baseline '{"modelProvider":"gemini"}'
          probe deny-plain "$deny"
          probe deny-skip "$deny" --dangerously-skip-permissions
          probe deny-bad '{"modelProvider":"gemini","permissions":{"deny":12345}}'
          probe preset-bad '{"modelProvider":"gemini","permissionPreset":12345}'

      - name: The init event's roster, with and without a deny block
        env:
          GEMINI_API_KEY: not-a-real-key-probe-only
        run: |
          set +e +o pipefail
          out=/tmp/agy-evidence
          deny='{"modelProvider":"gemini","permissions":{"allow":["mcp_grain-sandbox_*"],"deny":["run_command(*)","view_file(*)","write_to_file(*)","replace_file_content(*)","grep_search(*)","find_by_name(*)"]}}'

          roster() { # $1 label, $2 settings, rest = extra flags
            local label="$1" settings="$2"; shift 2
            local h="/tmp/rhome-$label"
            rm -rf "$h"; mkdir -p "$h/.gemini/antigravity-cli" "$h/.gemini/config" "$h/ws"
            printf '%s' "$settings" > "$h/.gemini/antigravity-cli/settings.json"
            echo '{"mcpServers":{}}' > "$h/.gemini/config/mcp_config.json"
            {
              echo "########## $label   (flags: $*)"
              echo '{"event":"user","message":{"role":"user","content":"say hi"}}' \
                | ( cd "$h/ws" && HOME="$h" timeout 120 agy "$@" \
                      --input-format stream-json --output-format stream-json \
                      --print-timeout 60s 2>&1 | head -40 )
            } >> "$out"/init-roster.txt 2>&1
          }
          roster skip-only '{"modelProvider":"gemini"}' --dangerously-skip-permissions
          roster skip-deny "$deny" --dangerously-skip-permissions
          roster deny-only "$deny"
          roster plain '{"modelProvider":"gemini"}'
          wc -c "$out"/* 

      - name: Push the capture to a tag
        run: |
          set -euo pipefail
          tag="agy-probe-255-${GITHUB_SHA::7}"
          work=/tmp/evidence-repo
          rm -rf "$work"
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          cd "$work"
          git config user.email "actions@github.com"
          git config user.name "agy probe"
          rm -rf docs/agy-evidence
          mkdir -p docs/agy-evidence
          cp /tmp/agy-evidence/* docs/agy-evidence/
          git add -A docs/agy-evidence
          git commit -m "agy probe evidence for task 255 (round 3)"
          git tag -f "$tag"
          git push -f origin "$tag"
          echo "pushed tag $tag"

      - name: Digest
        run: |
          set +e +o pipefail
          cd /tmp/agy-evidence
          echo "===== permissions type names ====="; head -60 permissions-types.txt
          echo "===== init rosters ====="; head -80 init-roster.txt
          echo "::error::probe job -- fails on purpose so its log is quoted back"
          exit 1
