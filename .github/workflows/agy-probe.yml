# TEMPORARY probe job for task 255 -- delete before this branch merges.
#
# Round 2: the settings schema around "permissions", and what a print-mode
# run actually loads. `-p "/permissions"` and `-p "/config"` answer without
# an agent turn (agy's own changelog: those slash commands are answered in
# print mode without spending quota), so this needs no credential.
name: agy-probe

on:
  push:
    branches: [grain/task-255]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: probe agy permissions schema
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install the agy CLI
        run: |
          set -euo pipefail
          curl -fsSL --max-time 180 https://antigravity.google/cli/install.sh -o /tmp/agy-install.sh
          test -s /tmp/agy-install.sh
          bash /tmp/agy-install.sh
          rm -f /tmp/agy-install.sh
          agy="$(find "$HOME" -type f -name agy -perm -u+x 2>/dev/null | head -n1 || true)"
          test -n "$agy"
          sudo ln -sf "$agy" /usr/local/bin/agy
          echo "AGY_BIN=$agy" >> "$GITHUB_ENV"
          agy --version

      - name: Schema, with adjacency
        run: |
          set -uo pipefail
          out=/tmp/agy-evidence
          rm -rf "$out"; mkdir -p "$out"
          agy --version > "$out"/version.txt 2>&1
          # Unsorted: neighbouring lines are physically adjacent strings in
          # the binary, which for Go struct tags means neighbouring fields.
          strings -n 4 "$AGY_BIN" > /tmp/agy.strings

          ctx() { echo "##### $1"; grep -a -n -B "${3:-6}" -A "${3:-6}" -- "$2" /tmp/agy.strings | head -"${4:-120}"; echo; }
          {
            ctx 'json:"permissions"' 'json:"permissions"' 10 200
            ctx 'json:"deny' 'json:"deny,omitempty"' 10 200
            ctx 'json:"allow,omitempty"' 'json:"allow,omitempty"' 10 200
            ctx 'permissionPreset' 'permissionPreset' 12 200
            ctx 'fileAccessPolicy' 'fileAccessPolicy' 12 200
            ctx 'agentPermissions' 'agentPermissions' 12 200
            ctx 'default_grant' 'default_grant' 8 120
            ctx 'is prohibited by' 'is prohibited by' 8 120
            ctx 'allow_tool' 'json:"allow_tool,omitempty"' 8 120
            ctx 'cascade_denied_commands' 'cascade_denied_commands' 8 120
          } > "$out"/schema-context.txt 2>&1

          grep -a -iE 'skip.?permission|dangerously|auto.?approve|autoapprove|bypass' /tmp/agy.strings \
            | sort -u | head -120 > "$out"/strings-skip-permissions.txt
          grep -a -iE '^[A-Za-z ,._-]*(deny|denied|prohibit|not allowed|blocked)[A-Za-z ,._%-]*$' /tmp/agy.strings \
            | sort -u | head -200 > "$out"/strings-denial-messages.txt
          grep -a -iE 'allow-?rule|allowlist|deny.?rule|permission rule|/permissions' /tmp/agy.strings \
            | sort -u | head -120 > "$out"/strings-rules.txt

      - name: What a print-mode run actually loads
        run: |
          set -uo pipefail
          out=/tmp/agy-evidence

          probe() { # $1 = label, $2 = settings json, rest = extra agy args
            local label="$1" settings="$2"; shift 2
            local h="/tmp/home-$label"
            rm -rf "$h"; mkdir -p "$h/.gemini/antigravity-cli" "$h/.gemini/config"
            printf '%s' "$settings" > "$h/.gemini/antigravity-cli/settings.json"
            echo '{"mcpServers":{}}' > "$h/.gemini/config/mcp_config.json"
            {
              echo "===== $label"
              echo "--- settings written:"; cat "$h/.gemini/antigravity-cli/settings.json"; echo
              for cmd in /permissions /config; do
                echo "--- agy $* -p $cmd"
                ( cd /tmp && HOME="$h" timeout 120 agy "$@" -p "$cmd" 2>&1 | head -80 )
                echo "exit=$?"
              done
              echo "--- settings.json after the run (agy may rewrite it):"
              cat "$h/.gemini/antigravity-cli/settings.json"; echo
            } >> "$out"/print-mode.txt 2>&1
          }

          deny='{"modelProvider":"gemini","permissions":{"allow":["mcp_grain-sandbox_*"],"deny":["run_command(*)","view_file(*)","write_to_file(*)","replace_file_content(*)","grep_search(*)","find_by_name(*)"]}}'
          probe baseline '{"modelProvider":"gemini"}'
          probe deny-plain "$deny"
          probe deny-skipperms "$deny" --dangerously-skip-permissions
          probe deny-singular '{"modelProvider":"gemini","permission":{"allow":[],"deny":["run_command(*)"]}}'
          probe deny-command '{"modelProvider":"gemini","permissions":{"deny":["command(*)","write_file(*)","read_file(*)"]}}'
          probe preset-strict '{"modelProvider":"gemini","permissionPreset":"strict"}'
          probe garbage '{"modelProvider":"gemini","permissions":{"deny":12345}}'

          wc -l "$out"/* | tail -20

      - name: Push the capture to a tag
        run: |
          set -euo pipefail
          tag="agy-probe-255-${GITHUB_SHA::7}"
          work=/tmp/evidence-repo
          rm -rf "$work"
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          cd "$work"
          git config user.email "actions@github.com"
          git config user.name "agy probe"
          rm -rf docs/agy-evidence
          mkdir -p docs/agy-evidence
          cp /tmp/agy-evidence/* docs/agy-evidence/
          git add -A docs/agy-evidence
          git commit -m "agy probe evidence for task 255 (round 2)"
          git tag -f "$tag"
          git push -f origin "$tag"
          echo "pushed tag $tag"

      - name: Digest
        run: |
          set -uo pipefail
          cd /tmp/agy-evidence
          echo "===== print mode ====="; head -200 print-mode.txt
          echo "::error::probe job -- fails on purpose so its log is quoted back"
          exit 1
