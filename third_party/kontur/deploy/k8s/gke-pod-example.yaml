# Minimal, self-contained example of running kontur on GKE: apply this to
# a cluster that has nested virtualization enabled (see
# deploy/k8s/gke.md) and it boots one VM with no other setup -- no
# node-local image cache to pre-populate, no device plugin to install, no
# init container to fetch anything first.
#
# It gets away with that because both the guest disk image and the guest
# kernel are baked into the kontur image itself (CHV_DISK_IMAGE/
# CHV_KERNEL are both left unset below, so kontur run's own defaults take
# over -- see the main README's "Guest disk image and kernel"). The only
# thing kontur still needs from outside the image is KVM access:
# securityContext.privileged: true plus a /dev/kvm hostPath, the simpler
# of the two options deploy/k8s/pod-example.yaml documents (the other
# being a device plugin such as kubevirt/kubernetes-device-plugins, which
# needs its own DaemonSet installed on the cluster first -- worth it to
# drop pod privileges, not needed just to get something running).
#
# The VM this boots has no network of its own -- that is what the
# netshim init container in gke-pod-exec-example.yaml adds -- but it is
# still one you can run commands in: `kubectl exec <pod> -- kontur exec
# -- <command>` reaches the guest over the VM's own vsock device rather
# than over guest networking (see the main README's "Execing into a
# VM"), which is why this example needs no control link and no extra
# environment for it.
#
# Substitute IMAGE_PLACEHOLDER with your own pushed kontur image
# (see deploy/k8s/gke.md) before applying.
apiVersion: v1
kind: Pod
metadata:
  name: kontur-gke-example
  labels:
    app: kontur-gke-example
spec:
  restartPolicy: Never
  # Must comfortably exceed CHV_SHUTDOWN_TIMEOUT below so kontur's own
  # graceful-shutdown sequence can run to completion before the kubelet
  # SIGKILLs the container itself.
  terminationGracePeriodSeconds: 40
  containers:
    - name: web
      image: IMAGE_PLACEHOLDER
      args: ["run"]
      env:
        # Boot sizes, plus the ceilings `kubectl exec <pod> -- kontur
        # resize` can grow the running guest up to. Both ceilings are
        # fixed at boot and both default to no headroom at all
        # (CHV_CPUS_MAX to CHV_CPUS, CHV_MEMORY_MAX_MB to the larger of
        # 2048 and CHV_MEMORY_MB), so a resize against a pod without
        # them fails ("Requested vCPUs exceed maximum") or silently does
        # nothing. See the main README's "Memory hotplug"/"CPU hotplug".
        - name: CHV_CPUS
          value: "2"
        - name: CHV_CPUS_MAX
          value: "4"
        - name: CHV_MEMORY_MB
          value: "1024"
        - name: CHV_MEMORY_MAX_MB
          value: "2048"
        - name: CHV_SHUTDOWN_TIMEOUT
          value: "20s"
      # Without this the pod's Ready condition reports on the container,
      # which is up well before the guest inside it has booted. "kontur
      # ready" dials the guest's own agent over the VM's vsock device --
      # so it works on this manifest too, which gives the guest no
      # network at all -- and exits zero once the guest answers a
      # command, which is what makes "kubectl wait
      # --for=condition=Ready" wait for the guest. "-timeout 0" is a
      # single attempt; the kubelet does the retrying. See the top-level
      # README's "Readiness".
      readinessProbe:
        exec:
          command: ["/usr/local/bin/kontur", "ready", "-timeout", "0"]
        periodSeconds: 5
        timeoutSeconds: 5
      resources:
        # Requests cover the VM as it boots; limits cover it grown to
        # both ceilings above, since a hotplugged vCPU competes for this
        # container's CPU quota and hotplugged guest memory counts
        # against its memory limit like any other page it touches.
        requests:
          cpu: "2"
          memory: 2Gi
        limits:
          cpu: "4"
          memory: 3Gi
      securityContext:
        privileged: true
      volumeMounts:
        - name: dev-kvm
          mountPath: /dev/kvm
  volumes:
    - name: dev-kvm
      hostPath:
        path: /dev/kvm
