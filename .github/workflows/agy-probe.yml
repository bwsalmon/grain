# TEMPORARY probe job for task 255 -- delete before this branch merges.
#
# Round 5. Round 4 turned up agy's own shipped documentation, materialized
# into a fresh HOME on first run:
# ~/.gemini/antigravity-cli/builtin/skills/agy-customizations/docs/. That is
# the authoritative account of settings.json's permissions block, so this
# round just fetches it.
name: agy-probe

on:
  push:
    branches: [grain/task-255]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: probe agy permissions schema
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install the agy CLI
        run: |
          set -euo pipefail
          curl -fsSL --max-time 180 https://antigravity.google/cli/install.sh -o /tmp/agy-install.sh
          test -s /tmp/agy-install.sh
          bash /tmp/agy-install.sh
          rm -f /tmp/agy-install.sh
          agy="$(find "$HOME" -type f -name agy -perm -u+x 2>/dev/null | head -n1 || true)"
          test -n "$agy"
          sudo ln -sf "$agy" /usr/local/bin/agy
          echo "AGY_BIN=$agy" >> "$GITHUB_ENV"
          agy --version

      - name: Materialize and collect the shipped docs
        env:
          GEMINI_API_KEY: not-a-real-key-probe-only
        run: |
          set +e +o pipefail
          out=/tmp/agy-evidence
          rm -rf "$out"; mkdir -p "$out"
          agy --version > "$out"/version.txt 2>&1
          h=/tmp/h-docs
          rm -rf "$h"; mkdir -p "$h/.gemini/antigravity-cli" "$h/.gemini/config"
          echo '{"modelProvider":"gemini"}' > "$h/.gemini/antigravity-cli/settings.json"
          echo '{"mcpServers":{}}' > "$h/.gemini/config/mcp_config.json"
          ( cd /tmp && HOME="$h" timeout 90 agy -p /help > "$out"/help-print.txt 2>&1 )
          docs="$h/.gemini/antigravity-cli/builtin/skills"
          find "$docs" -type f | sort > "$out"/skills-index.txt
          for f in "$docs"/agy-customizations/SKILL.md "$docs"/agy-customizations/docs/*.md; do
            [ -f "$f" ] || continue
            cp "$f" "$out"/"customizations-$(basename "$f")"
          done
          cp "$docs"/antigravity_guide/references/cli.md "$out"/guide-cli.md 2>/dev/null
          wc -l "$out"/*

      - name: Push the capture to a tag
        run: |
          set -euo pipefail
          tag="agy-probe-255-${GITHUB_SHA::7}"
          work=/tmp/evidence-repo
          rm -rf "$work"
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          cd "$work"
          git config user.email "actions@github.com"
          git config user.name "agy probe"
          rm -rf docs/agy-evidence
          mkdir -p docs/agy-evidence
          cp /tmp/agy-evidence/* docs/agy-evidence/
          git add -A docs/agy-evidence
          git commit -m "agy probe evidence for task 255 (round 5: shipped docs)"
          git tag -f "$tag"
          git push -f origin "$tag"
          echo "pushed tag $tag"

      - name: Digest
        run: |
          set +e +o pipefail
          cd /tmp/agy-evidence
          echo "===== json_configs.md ====="; head -120 customizations-json_configs.md
          echo "::error::probe job -- fails on purpose so its log is quoted back"
          exit 1
