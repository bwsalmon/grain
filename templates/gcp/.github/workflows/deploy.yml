# Push to main -> the deployment converges. Nothing in this workflow logs
# into the host: Terraform reconciles the GCP side, the two secrets go
# straight into the instance's own metadata, and the new commit SHA lands
# there too -- which is what the on-VM config-sync service is watching.
#
# Neither the Terraform module nor the steps that drive it are vendored in
# this repo. Both are pulled fresh from bwsalmon/grain at the ref
# config/grain.tfvars names (grain_ref), the same ref the on-host deploy
# fetches grain from. One field of config pins what infrastructure CI
# applies, how CI applies it, and what grain software the host runs.
#
# That second part is why this file is as thin as it is. A config repo
# forks this workflow and then owns its copy, so anything written *here*
# is something nobody re-syncs: two real fixes (a null-safe
# agent_service_account output, a retry around a GCP stock-out) sat in the
# template for months without reaching a live deployment that had forked
# it. So the step bodies live in grain's ci/ directory and this file only
# wires them up -- it supplies values (which secrets, which config
# directory, which repo) and grain supplies the logic. A fix in grain now
# reaches every deployment on its next rollout.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  # Uncomment to also redeploy on a schedule, which is how you track a
  # moving grain_ref (e.g. "main") without pushing to this repo.
  # schedule:
  #   - cron: "17 6 * * *"

# One rollout at a time. Never cancel one in flight: it is mid-apply.
concurrency:
  group: grain-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for keyless auth to GCP
  issues: write # to create the labels the task queue runs on

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # The token the host watches for. A commit SHA for a push; SHA + run
      # id for a manual or scheduled run, so "redeploy now" always takes.
      DEPLOY_GENERATION: ${{ github.event_name == 'push' && github.sha || format('{0}-{1}', github.sha, github.run_id) }}
      TF_IN_AUTOMATION: "true"
      # A step's `if:` can't see the secrets context at all (GitHub
      # rejects it at parse time: "Unrecognized named-value: 'secrets'") --
      # only env, vars and a handful of others. jobs.<job_id>.env can see
      # secrets, so the WIF-vs-key branch has to happen here and get
      # checked via env below instead of inline.
      HAS_WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}

    steps:
      - uses: actions/checkout@v4

      # The one piece of logic that cannot come from grain: it is what
      # decides which grain to fetch, and it runs before there is one.
      - name: Determine which grain ref to pull Terraform and scripts from
        id: grain
        run: |
          set -euo pipefail
          ref="$(sed -n 's/^grain_ref[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' config/grain.tfvars | head -1)"
          echo "ref=${ref:-main}" >> "$GITHUB_OUTPUT"

      - name: Checkout grain (Terraform and the deploy steps live there, not here)
        uses: actions/checkout@v4
        with:
          repository: bwsalmon/grain
          ref: ${{ steps.grain.outputs.ref }}
          path: grain-src

      # Every step below runs a script out of that checkout, so an old
      # grain_ref is a hard failure rather than a preference. Checked once,
      # here, with an error that says what to do -- otherwise the first
      # missing script fails mid-rollout on "No such file or directory",
      # which says nothing about grain_ref at all.
      - name: Check grain has the deploy scripts this workflow runs
        env:
          GRAIN_REF: ${{ steps.grain.outputs.ref }}
        run: |
          set -euo pipefail
          missing=()
          for script in ensure-task-labels terraform-apply read-terraform-outputs \
                        push-host-secrets wait-for-host write-deploy-summary; do
            [ -x "grain-src/ci/$script.sh" ] || missing+=("ci/$script.sh")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::grain at ref '${GRAIN_REF}' is missing or cannot execute: ${missing[*]}"
            echo "This workflow runs its steps from grain's ci/ directory."
            echo "Move grain_ref in config/grain.tfvars to a ref that carries them."
            exit 1
          fi
          echo "grain-src/ci: every script this workflow runs is present"

      # This repo is also the task queue: an issue here, labelled
      # `grain-agent`, is what the automation service picks up. Creates
      # every label the queue runs on -- the ones the orchestrator moves an
      # issue between and the opt-in ones a human applies -- and converges
      # their colours. The list is grain's: grain/automation/labels.py.
      - name: Ensure the task labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: grain-src/ci/ensure-task-labels.sh "${{ github.repository }}"

      # Preferred: Workload Identity Federation, so this repo holds no GCP
      # key at all. grain's terraform/gcp/bootstrap-gcp.sh sets it up and
      # prints both values.
      - name: Authenticate to GCP (workload identity)
        if: ${{ env.HAS_WIF == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      # Fallback for projects that cannot use WIF. A long-lived key in a
      # GitHub secret is strictly worse; prefer the step above.
      - name: Authenticate to GCP (service account key)
        if: ${{ env.HAS_WIF != 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # init, validate and apply, with a backoff around the GCP stock-outs
      # that are a routine transient failure rather than a broken config.
      - name: Terraform init, validate and apply
        env:
          CONFIG_DIR: ${{ github.workspace }}/config
          CONFIG_REPO: ${{ github.repository }}
        run: grain-src/ci/terraform-apply.sh

      - name: Read outputs
        id: tf
        run: grain-src/ci/read-terraform-outputs.sh

      # The only place a secret value is ever decrypted. The values can
      # only be read here -- a script cannot reach the secrets context --
      # so they are handed over as environment variables and never on a
      # command line.
      - name: Push secrets to the host
        env:
          PROJECT: ${{ steps.tf.outputs.project_id }}
          INSTANCE: ${{ steps.tf.outputs.instance }}
          ZONE: ${{ steps.tf.outputs.zone }}
          GRAIN_GITHUB_TOKEN: ${{ secrets.GRAIN_GITHUB_TOKEN }}
          GRAIN_GITHUB_KEYS: ${{ secrets.GRAIN_GITHUB_KEYS }}
          GRAIN_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.GRAIN_CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_SERVICE_ACCOUNT: ${{ steps.tf.outputs.agent_service_account }}
        run: grain-src/ci/push-host-secrets.sh

      # The host reports progress through guest attributes, so CI fails
      # when the rollout fails rather than when `terraform apply` returns.
      - name: Wait for the host to converge
        env:
          PROJECT: ${{ steps.tf.outputs.project_id }}
          INSTANCE: ${{ steps.tf.outputs.instance }}
          ZONE: ${{ steps.tf.outputs.zone }}
          TIMEOUT_MINUTES: ${{ vars.ROLLOUT_TIMEOUT_MINUTES || '45' }}
        run: grain-src/ci/wait-for-host.sh

      - name: Summary
        if: always()
        run: grain-src/ci/write-deploy-summary.sh
