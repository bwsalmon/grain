# What a pull request against this repo would change in GCP. Read-only:
# it never applies, never touches Secret Manager, and never bumps the
# deploy generation.
name: plan

on:
  pull_request:
    paths:
      - "config/**"
      - "terraform/**"
      - ".github/workflows/**"

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (workload identity)
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Authenticate to GCP (service account key)
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -backend-config=../config/backend.hcl

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -lock=false \
            -var-file=../config/grain.tfvars \
            -var="config_repo=${{ github.repository }}" \
            -var="deploy_generation=pr-${{ github.event.pull_request.number }}" \
            | tee /tmp/plan.txt
          {
            echo "### terraform plan"
            echo
            echo '```terraform'
            tail -c 60000 /tmp/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
