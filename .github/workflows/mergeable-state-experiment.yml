# TEMPORARY -- the deliberately failing (and deliberately slow) checks the
# mergeable_state experiment needs, and nothing else. Reverted on the same
# branch once the run is recorded; it must never reach main.
#
# The question it exists to answer is in github.PullRequestDetail's
# MergeableState doc comment: whether GitHub's mergeable_state accounts
# for *check runs* (what Actions creates) or only for the older commit
# statuses, and what it reads in the gap between a push and the workflow
# run's check runs existing.
name: mergeable-state-experiment

on: pull_request

permissions:
  contents: read

jobs:
  # Red within a few seconds of the runner starting: the failing check the
  # experiment needs to see whether mergeable_state notices it.
  deliberate-failure:
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  # Still running long after the failure above has landed: the "pending
  # alongside failing" window, held open long enough to poll through.
  deliberate-slow:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 300
