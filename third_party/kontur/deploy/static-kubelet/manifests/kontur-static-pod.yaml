# Static pod manifest for the standalone kubelet set up by install.sh:
# drop this file into /etc/kubernetes/manifests (or wherever
# STATIC_POD_PATH points) and kubelet picks it up directly, no apiserver
# or `kubectl apply` involved. Copy of deploy/k8s/pod-example.yaml,
# adjusted for that standalone environment:
#
#  - Images come from the local registry (localhost:5000) that
#    local-registry.sh/build-and-push.sh set up, instead of ghcr.io.
#  - No devices.kubevirt.io/kvm resource request: that's satisfied by a
#    device plugin registering with the apiserver, which doesn't exist
#    here. /dev/kvm is bind-mounted instead, same as the "without a
#    device plugin" fallback described in deploy/k8s/pod-example.yaml.
#  - restartPolicy: Always -- kubelet requires this for static pods, so
#    unlike the ordinary example this VM restarts on exit rather than
#    staying stopped. To actually stop it, remove this file from the
#    static pod directory; kubelet then tears the pod down.
#
# Assumes disk image/kernel are already on the node under
# /var/lib/vm-images, as in the ordinary example.
apiVersion: v1
kind: Pod
metadata:
  name: kontur-vm
  labels:
    app: kontur-vm
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 40
  initContainers:
    - name: netshim
      image: localhost:5000/kontur:latest
      args: ["netshim"]
      env:
        - name: NETSHIM_VM
          value: "web"
        - name: NETSHIM_CONTROL_CIDR
          value: "169.254.100.1/24"
      securityContext:
        privileged: true
  containers:
    - name: web
      image: localhost:5000/kontur:latest
      args: ["run"]
      env:
        - name: CHV_DISK_IMAGE
          value: /images/disk.img
        - name: CHV_DISK_READONLY
          value: "true"
        - name: CHV_KERNEL
          value: /images/vmlinux
        # No "ip=" and no CHV_NET: the VM container derives both from the
        # identity the CNI put on the pod's own interface, which is why
        # it reads the same NETSHIM_* settings netshim did.
        - name: CHV_CMDLINE
          value: "console=ttyS0 root=/dev/vda ro"
        - name: NETSHIM_VM
          value: "web"
        - name: NETSHIM_CONTROL_CIDR
          value: "169.254.100.1/24"
        - name: CHV_CPUS
          value: "2"
        - name: CHV_MEMORY_MB
          value: "2048"
        - name: CHV_SHUTDOWN_TIMEOUT
          value: "20s"
      # Without this the pod's Ready condition reports on the container,
      # which is up well before the guest inside it has booted. "kontur
      # ready" is a mode of the same binary this image already runs: it
      # dials the guest's own agent over the VM's vsock device and exits
      # zero once the guest answers a command, so "kubectl wait
      # --for=condition=Ready" waits for the guest. "-timeout 0" is a
      # single attempt -- the kubelet does the retrying, on
      # periodSeconds. See the top-level README's "Readiness".
      readinessProbe:
        exec:
          command: ["/usr/local/bin/kontur", "ready", "-timeout", "0"]
        periodSeconds: 5
        timeoutSeconds: 5
      securityContext:
        privileged: true
      volumeMounts:
        - name: images
          mountPath: /images
          readOnly: true
        - name: kvm
          mountPath: /dev/kvm
  volumes:
    - name: images
      hostPath:
        path: /var/lib/vm-images
        type: Directory
    - name: kvm
      hostPath:
        path: /dev/kvm
        type: CharDevice
