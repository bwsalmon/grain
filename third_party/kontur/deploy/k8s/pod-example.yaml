# Example Pod running one cloud-hypervisor VM that takes over the pod's
# own IP. The netshim init container splices the VM's tap onto the pod's
# interface, so the guest boots with the address and MAC the CNI assigned
# and the pod behaves like any other single-container pod from outside:
# Services, readiness probes and DNS all address it the ordinary way,
# with no per-VM port forwarding to arrange.
#
# One VM per pod is the model -- there is exactly one identity in a
# network namespace to take over -- so a second VM belongs in a second
# pod.
#
# The init container and the VM container both use the same kontur image
# -- one Go binary with two modes, selected by args ("netshim" for the
# init container, "run" for the VM container) -- and both read the same
# NETSHIM_* settings, so they cannot disagree about the tap: netshim
# creates it, and the VM container derives its own --net and the guest's
# "ip=" boot parameter from what it reads off the pod's interface.
#
# Assumes:
#  - the node has /dev/kvm exposed as the allocatable resource
#    "devices.kubevirt.io/kvm" via a device plugin such as
#    https://github.com/kubevirt/kubernetes-device-plugins. Without that,
#    drop the "devices.kubevirt.io/kvm" resource below and instead set
#    securityContext.privileged: true plus a hostPath volume for /dev/kvm.
#  - the disk image and kernel are already present on the node under
#    /var/lib/vm-images, e.g. pre-populated by a node-local image cache.
#    Omitting CHV_DISK_IMAGE/CHV_KERNEL instead boots the reference guest
#    disk image and kernel baked into the kontur image itself (see the
#    main README's "Guest disk image and kernel"), which is what
#    deploy/k8s/gke-pod-example.yaml does.
#
# `kubectl exec -it chv-vm-example -- kontur exec -- <command>` runs
# <command> inside the VM's guest itself, rather than in this otherwise-
# empty container -- `kubectl exec ... -- kontur exec` alone (no `--
# <command>`) opens an interactive login shell instead. It needs nothing
# configured here: exec reaches the guest over the VM's own vsock device
# (see the top-level README's "Execing into a VM"), not over the control
# link below, which is why there is no exec address to set and why a VM
# with no netshim in front of it is still one you can exec into.
apiVersion: v1
kind: Pod
metadata:
  name: chv-vm-example
  labels:
    app: chv-vm-example
spec:
  restartPolicy: Never
  # Must comfortably exceed CHV_SHUTDOWN_TIMEOUT below so kontur's own
  # graceful-shutdown sequence can run to completion before the kubelet
  # SIGKILLs the container itself.
  terminationGracePeriodSeconds: 40
  initContainers:
    - name: netshim
      image: ghcr.io/bwsalmon/kontur:latest
      args: ["netshim"]
      env:
        - name: NETSHIM_VM
          value: "web"
        - name: NETSHIM_CONTROL_CIDR
          value: "169.254.100.1/24"
      securityContext:
        # netshim creates a tap and programs tc filters in the pod's
        # network namespace, which NET_ADMIN/NET_RAW would cover -- but
        # the netlink library creates a tap by opening /dev/net/tun, and
        # a pod has no per-device grant to hand it the way `docker run
        # --device` does. Hence privileged here. It writes no sysctl and
        # installs no nftables rules, which is why the same setup under
        # `docker run` needs only those two capabilities plus the device
        # (see the top-level README's "Docker backend" section).
        privileged: true
  containers:
    - name: web
      image: ghcr.io/bwsalmon/kontur:latest
      args: ["run"]
      env:
        - name: CHV_DISK_IMAGE
          value: /images/disk.img
        - name: CHV_DISK_READONLY
          value: "true"
        - name: CHV_KERNEL
          value: /images/vmlinux
        # No "ip=" here, and no CHV_NET: both are derived at boot from
        # the address, MAC and MTU the CNI put on the pod's interface,
        # which is why this container reads the same NETSHIM_* settings
        # the init container did.
        - name: CHV_CMDLINE
          value: "console=ttyS0 root=/dev/vda ro"
        - name: NETSHIM_VM
          value: "web"
        - name: NETSHIM_CONTROL_CIDR
          value: "169.254.100.1/24"
        - name: CHV_CPUS
          value: "2"
        - name: CHV_MEMORY_MB
          value: "2048"
        - name: CHV_SHUTDOWN_TIMEOUT
          value: "20s"
      # Without this the pod's Ready condition reports on the container,
      # which is up well before the guest inside it has booted. "kontur
      # ready" dials the guest's own agent over the VM's vsock device and
      # exits zero once the guest answers a command, so "kubectl wait
      # --for=condition=Ready" waits for the guest rather than for the
      # container wrapping it. "-timeout 0" is a single attempt; the
      # kubelet does the retrying, on periodSeconds. See the top-level
      # README's "Readiness".
      readinessProbe:
        exec:
          command: ["/usr/local/bin/kontur", "ready", "-timeout", "0"]
        periodSeconds: 5
        timeoutSeconds: 5
      resources:
        requests:
          cpu: "2"
          memory: 3Gi
          devices.kubevirt.io/kvm: "1"
        limits:
          cpu: "2"
          memory: 3Gi
          devices.kubevirt.io/kvm: "1"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: images
          mountPath: /images
          readOnly: true
  volumes:
    - name: images
      hostPath:
        path: /var/lib/vm-images
        type: Directory
