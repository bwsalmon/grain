# What a pull request against this repo would change, syntactically.
# Deliberately never authenticates to GCP: `terraform plan` evaluates
# `data` sources during planning (`data "external"` runs an arbitrary
# program and reads its JSON output -- a real, legitimate feature, not an
# edge case), so an authenticated plan job triggered on `pull_request`
# would hand a live deployer credential to whatever a PR's own `.tf`
# files say to run, before any human reviews anything and with no
# workflow-file edit required to get there. Denying the deploy
# workflow's own credential the `workflow` scope only closes the door on
# an agent rewriting *this* file -- it does nothing about an unmodified,
# legitimate step already handing secrets to PR-branch code, which is
# what an authenticated plan-on-PR job is. `fmt`/`validate` need neither
# a provider nor backend state, so no credential of any kind reaches a
# job that runs before a human has looked at the diff. The tradeoff: no
# authenticated plan preview before merge -- `deploy.yml`'s own
# `terraform apply` log is the first real plan, and by then a human
# already approved the merge.
name: plan

on:
  pull_request:
    paths:
      - "config/**"
      - "terraform/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend, no credentials)
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate -no-color
