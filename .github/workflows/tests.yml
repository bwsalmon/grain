# The unit suite, on every pull request and every push to main.
#
# Runs the whole of `tests/` unscoped, which is safe here and only here:
# the live suites gate themselves on `/dev/kvm`, `qemu:///system`, a
# `br-grain` bridge and a reachable netfilter, none of which a hosted
# runner has, so they skip rather than run. The README's warning that an
# unscoped `pytest` will destroy a running cluster is about a host that
# has one up -- a fresh runner has nothing to destroy. Scoping the run to
# a hand-maintained file list instead would just mean a new unit suite
# silently going untested the day someone forgets to add it.
#
# Nothing here holds a credential: `contents: read`, no secrets, no
# environment. That is deliberate rather than incidental. `pull_request`
# runs code from the PR's own branch before any human has read it, so
# this job is only safe to trigger that way for as long as it has nothing
# worth stealing -- the same argument the config repo's plan.yml makes for
# never authenticating a plan-on-PR job.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded runs on a branch are dead weight; a merge to main is the
# record of what shipped, so let those finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: unit tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing is a fact worth having about the other.
      fail-fast: false
      matrix:
        # The floor `pyproject.toml` declares and the current release --
        # the stock interpreters on Debian 12 and 13, which is what the
        # host this deploys to actually is.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # grain declares no dependencies and means it -- stdlib only, so it
      # runs on a stock Debian host with nothing installed. pytest is the
      # single build-time exception, and pinning the major line keeps a
      # future release's collection changes from turning CI red on a
      # commit that touched nothing.
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"

      # `python -m pytest`, not `pytest`: the module form puts the
      # repository root on `sys.path`, which is how `import grain`
      # resolves without installing the package first. The bare console
      # script does not, and every test module fails to collect.
      - name: Run the unit suite
        run: python -m pytest

  go-test:
    name: v2 (go)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: v2/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/pkg/ui/frontend/package-lock.json

      - name: Build frontend
        working-directory: v2
        run: make frontend

      - name: Build
        working-directory: v2
        run: go build ./...

      - name: Vet
        working-directory: v2
        run: go vet ./...

      # gitproxy's live_test.go and e2e's live_test.go each gate themselves
      # (missing `git`, unset GEMINI_API_KEY) the same way the pytest job's
      # live suites gate on /dev/kvm and friends -- they skip on a runner
      # that has none of that rather than failing.
      - name: Test
        working-directory: v2
        run: go test ./...

      - name: Test frontend
        working-directory: v2/pkg/ui/frontend
        run: npm test

  # A separate job rather than a step in go-test above: this needs a real
  # browser and the apt packages `playwright install --with-deps` pulls
  # in for it, which would slow down and complicate the fast, browser-free
  # go-test job for no benefit to it (see test-e2e's own doc comment in
  # v2/Makefile).
  ui-e2e:
    name: v2 (ui e2e)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: v2/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/pkg/ui/frontend/package-lock.json

      # Builds the frontend, installs Chromium and its apt dependencies,
      # then runs the Playwright suite against a real pkg/ui.Server
      # (`grain demo`) -- see v2/Makefile's test-e2e target.
      - name: Test e2e
        working-directory: v2
        run: make test-e2e

  # The two Terraform modules -- v1's controller-plus-sandbox-pool
  # (terraform/gcp) and v2's staging environment (terraform/gcp-v2) --
  # had no machine check of any kind until this job. Nothing else in this
  # workflow reads a .tf file, so a typo'd variable reference or an
  # unformatted block could sit on main indefinitely and only surface at
  # `terraform apply` time, in front of a real project. That is the worst
  # possible place to find it: gcp-v2 in particular has never been
  # applied, so every error it holds is still undiscovered.
  #
  # `init -backend=false` is what keeps this job as credential-free as
  # the two above it. Both modules declare `backend "gcs" {}` and expect
  # an operator to fill it in with -backend-config; -backend=false skips
  # backend initialization outright, so this installs the provider plugins
  # and nothing more -- no GCS bucket, no service account, no `contents:
  # read` exception. Validation is entirely local after that: `validate`
  # checks syntax, references and types against the provider schema
  # without contacting GCP or reading state.
  #
  # Note that gcp-v2's `google_iap_brand` deprecation (see that module's
  # README, "Get an IAP OAuth client") surfaces here as a *warning*, which
  # `validate` does not fail on. It stays visible in the log rather than
  # becoming a red build for a resource `create_iap_brand = false` does
  # not even create by default.
  terraform:
    name: terraform (${{ matrix.module }})
    runs-on: ubuntu-latest

    strategy:
      # Same reasoning as the pytest matrix: one module failing is a fact
      # worth having about the other, especially while v2's module is the
      # one under active development.
      fail-fast: false
      matrix:
        module: [terraform/gcp, terraform/gcp-v2]

    steps:
      - uses: actions/checkout@v4

      # A constraint, not an exact version: this tracks the current 1.13
      # patch release the way the pytest job pins a major line, so a
      # patch release cannot turn CI red on a commit that touched
      # nothing, and a deliberate bump moves the whole floor at once.
      # Both modules' versions.tf already require >= 1.6.0.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"
          # The wrapper re-execs terraform to capture stdout/stderr as step
          # outputs. Nothing here consumes those, and it only obscures
          # `fmt -diff`'s own output.
          terraform_wrapper: false

      # -diff so a formatting failure shows what to change, rather than
      # just naming the file and leaving the reader to run fmt locally.
      - name: Format
        working-directory: ${{ matrix.module }}
        run: terraform fmt -check -recursive -diff

      - name: Init
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: ${{ matrix.module }}
        run: terraform validate
