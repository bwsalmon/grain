# Everything that can be checked without a credential, on every pull
# request and every push to main: the Go suite, the frontend, the
# Playwright UI suite, the real-KVM sandbox suite, and the Terraform
# module.
#
# `/dev/kvm` was once assumed to be something "a hosted runner does not
# have". It is not: GitHub's Linux runners expose it (nested
# virtualization on their Azure hosts), and the real-vm job below boots
# actual guests on it. That mistaken belief is why pkg/orchestrator's
# real-VM suite sat skipping for its whole life while reading as
# coverage -- see that job.
#
# Nothing here holds a credential: `contents: read`, no secrets, no
# environment. That is deliberate rather than incidental. `pull_request`
# runs code from the PR's own branch before any human has read it, so
# this job is only safe to trigger that way for as long as it has nothing
# worth stealing -- the same argument the config repo's plan.yml makes for
# never authenticating a plan-on-PR job. The suites that need a built
# image (tests/container and tests/installer) skip here and run in
# build-artifacts.yml on push instead; the one test that needs a model
# credential (tests/e2e's live agy run) skips here and runs nightly in
# live-agent.yml, which holds that credential in an environment no branch
# can reach.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded runs on a branch are dead weight; a merge to main is the
# record of what shipped, so let those finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # tests/ is four packages, all of them Go and all of them reached by the
  # go-test job's own `go test ./...` below: tests/e2e (the end-to-end
  # suite), tests/deploy (cross-file content checks, which need nothing but
  # the tree), and tests/container and tests/installer, which drive a real
  # container and a real installer and so gate themselves on
  # GRAIN_TEST_IMAGE / GRAIN_INSTALLER_E2E. Those last two skip on this
  # runner and are run for real by build-artifacts.yml, which has an image
  # to give them.
  #
  # tests/deploy is worth naming because nothing else sees what it sees: it
  # asserts agreements *between* files -- the Dockerfile, scripts/setup.sh,
  # this workflow's sibling, the Makefile and terraform/gcp/files/deploy.sh
  # all naming the same image, the same unit and the same paths -- which no
  # package's own tests can check. It used to be a Python suite with a job
  # of its own; it is Go now, so it rides along with everything else.
  go-test:
    name: go
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Before the frontend build and everything after it: this needs
      # nothing but the toolchain and the tree, takes seconds, and until
      # it existed nothing in CI read formatting at all -- so drift was
      # free to grow, and `gofmt -l` was useless as a local signal
      # because it always had something to say about files the change
      # had not touched.
      #
      # `make fmt` rather than an inline `gofmt -l` so the gate has one
      # definition (see the target's own comment in the Makefile for what
      # it covers and why it is plain gofmt rather than `gofmt -s`); it
      # prints a diff per offender, so the log says what to change.
      - name: Format
        run: make fmt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend
        run: make frontend

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # gitproxy's live_test.go and tests/e2e's live_test.go each gate
      # themselves (missing `git`, unset GEMINI_API_KEY) -- they skip on a
      # runner that has none of that rather than failing. The second of
      # those is run for real by live-agent.yml, nightly; this step's "ok"
      # says nothing about it.
      #
      # pkg/orchestrator's own real-VM tests gate on GRAIN_REAL_VM_TESTS,
      # which only the real-vm job below sets, so they skip here. Do not
      # read this step's "ok" for that package as covering them.
      #
      # They used to gate on /dev/kvm alone, which reads like it excludes
      # them from a hosted runner and does not: these runners have it, so
      # the suite ran here too, twice per commit, against `go test`'s 600s
      # per-package default. It needs ~336s of that, and lost the race
      # often enough to redden PRs that had touched none of it.
      #
      # -race, which is the same command the Makefile's `test` target has
      # always run and which this step, for its whole life until now, did
      # not: nothing in CI had ever run the race detector, so a data race
      # in a daemon that is a reconcile loop, a goroutine per dispatch, a
      # poller per addendum, an atomic ForbiddenSet replaced under a
      # serving proxy and a stateManager lock shared between a UI handler
      # and a timer reached main unless a developer happened to run `make
      # test` on a machine where it showed. It costs roughly double this
      # step's wall clock (~2m30s to ~4m40s measured on four cores), on a
      # job whose long pole is elsewhere.
      #
      # The detector is a cgo library, so this step needs CGO_ENABLED at
      # its default -- `-race requires cgo or SWIG` is what setting it to
      # 0 anywhere above would get, not a quiet loss of coverage. Only
      # `make build` turns cgo off, and only for the binary that ships.
      - name: Test
        run: go test -race ./...

      - name: Test frontend
        working-directory: ui
        run: npm test

  # A separate job rather than a step in go-test above: this needs a real
  # browser and the apt packages `playwright install --with-deps` pulls
  # in for it, which would slow down and complicate the fast, browser-free
  # go-test job for no benefit to it (see test-e2e's own doc comment in
  # Makefile).
  ui-e2e:
    name: ui e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Builds the frontend, installs Chromium and its apt dependencies,
      # then runs the Playwright suite against a real pkg/ui.Server
      # (`grain demo`) -- see Makefile's test-e2e target.
      - name: Test e2e
        run: make test-e2e

  # Boots real cloud-hypervisor VMs under real KVM and drives them the way
  # the daemon does -- pkg/orchestrator/kontur_docker_real_test.go, the
  # only test that covers the sandbox path end to end.
  #
  # It gated on /dev/kvm, and for its whole life nothing gave it one, so
  # it never ran: `go test ./...` in go-test above reports "ok" for that
  # package with both real tests skipped, which reads exactly like
  # coverage and is not. (It gates on GRAIN_REAL_VM_TESTS now, set in
  # this job alone, so that "ok" stays a skip by design rather than by
  # whatever the runner happened to provide.) What that cost, concretely:
  # bwsalmon/kontur#35
  # moved the guest's SSH keypair from build time to boot time, and left
  # this test handing build-guest.sh an OPERATOR_SSH_PUBLIC_KEY that no
  # longer existed and pointing ExecKeyPath at a key no guest would
  # authorize. Every VM it built would have come up unreachable. Nothing
  # reported it; it was found by reading the test. A silent skip is worse
  # than no test, because it is mistaken for one.
  #
  # A separate job rather than a step in go-test, for the same reason
  # ui-e2e is one: it wants a docker daemon and several minutes of guest
  # build, and failing independently says which half broke. It is not
  # path-filtered -- a suite that only runs when someone predicted it was
  # relevant is most of the way back to one that never runs.
  real-vm:
    name: real KVM sandboxes
    runs-on: ubuntu-latest
    # Building the guest dominates this, in two stages: the kontur base
    # image out of the vendored tree (debootstrap plus a distro kernel),
    # then a VM booted from it and provisioned by guest-setup.sh. The
    # second stage is what a deployment no longer pays -- it pulls the
    # image CI publishes -- and what this job still does, because the
    # point here is to prove the vendored kontur works against pkg/kontur
    # rather than to trust an image built from some other commit.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The whole point of the job. konturDockerRealTestPrereqs skips on a
      # missing /dev/kvm, so without this the suite would quietly do
      # nothing and this job would pass -- the exact failure it exists to
      # make impossible. (It also skips unless GRAIN_REAL_VM_TESTS is set,
      # which the suite step below sets and nothing else does; the
      # "--- PASS" assertion there is what catches dropping it.)
      # Building the base, booting it and committing the result puts
      # three multi-gigabyte copies of the guest disk on this runner --
      # the base image's, the VM container's, and the commit's own layer
      # -- and a hosted runner does not have room for all of them beside
      # its preinstalled toolchains. kontur's own KVM job ran out here
      # first; this is the same step.
      #
      # Not $AGENT_TOOLSDIRECTORY (/opt/hostedtoolcache): that is where
      # actions/setup-go just put the Go this job builds konturctl with.
      # Deleting it reclaims a couple of GB and costs the toolchain --
      # "go: command not found", exit 127, from a step that has nothing
      # to do with disk.
      - name: Reclaim runner disk
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost || true
          echo "after:"; df -h /

      - name: Require KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not present on this runner, so the suite below would skip rather than run. A green tick here would mean nothing." >&2
            exit 1
          fi
          ls -l /dev/kvm
          docker version
          command -v ssh-keygen

      # -count=1 so a cached "ok" from an earlier skip can never stand in
      # for a real run. -v because when a guest fails to come up, the
      # per-step log is the only account of how far it got.
      - name: Real KVM sandbox suite
        env:
          GRAIN_REAL_VM_TESTS: "1"
        run: |
          go test ./pkg/orchestrator/ \
            -run 'TestKonturSandboxesAgainstARealDockerBackedVM|TestKonturSandboxesAcquireCreatesTwoRealVMsConcurrently' \
            -count=1 -v -timeout 40m 2>&1 | tee /tmp/kontur-vm.log
          # `go test` reports "ok" both for a package whose selected tests
          # all skipped and for one where -run matched nothing at all, so
          # neither shows up as a failure on its own. Assert the two tests
          # actually ran, by name.
          for t in TestKonturSandboxesAgainstARealDockerBackedVM \
                   TestKonturSandboxesAcquireCreatesTwoRealVMsConcurrently; do
            if ! grep -q -- "--- PASS: $t" /tmp/kontur-vm.log; then
              echo "::error::$t did not run and pass; this job only means something when both do" >&2
              exit 1
            fi
          done

      # A guest that never becomes reachable says so only on its console,
      # which the VM container's own logs carry.
      - name: Guest consoles on failure
        if: failure()
        run: |
          for c in $(docker ps -aq --filter 'name=kontur-vm-'); do
            echo "===== $(docker inspect -f '{{.Name}}' "$c") ====="
            docker logs "$c" 2>&1 | tail -100
          done

  # terraform/gcp had no machine check of any kind until this job.
  # Nothing else in this workflow reads a .tf file, so a typo'd variable
  # reference or an unformatted block could sit on main indefinitely and
  # only surface at `terraform apply` time, in front of a real project --
  # the worst possible place to find it, and now two deployments' worth
  # of it, since bwsalmon/agents applies this one module for both its
  # main and its staging install.
  #
  # `init -backend=false` is what keeps this job as credential-free as
  # the ones above it. The module declares `backend "gcs" {}` and expects
  # an operator to fill it in with -backend-config; -backend=false skips
  # backend initialization outright, so this installs the provider plugins
  # and nothing more -- no GCS bucket, no service account, no `contents:
  # read` exception. Validation is entirely local after that: `validate`
  # checks syntax, references and types against the provider schema
  # without contacting GCP or reading state.
  #
  # Note that the module's `google_iap_brand` deprecation (see its
  # README, "Get an IAP OAuth client") surfaces here as a *warning*, which
  # `validate` does not fail on. It stays visible in the log rather than
  # becoming a red build for a resource `create_iap_brand = false` does
  # not even create by default.
  terraform:
    name: terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A constraint, not an exact version: this tracks the current 1.13
      # patch release, so a patch release cannot turn CI red on a commit
      # that touched nothing, and a deliberate bump moves the whole floor
      # at once. The module's versions.tf already requires >= 1.6.0.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"
          # The wrapper re-execs terraform to capture stdout/stderr as step
          # outputs. Nothing here consumes those, and it only obscures
          # `fmt -diff`'s own output.
          terraform_wrapper: false

      # -diff so a formatting failure shows what to change, rather than
      # just naming the file and leaving the reader to run fmt locally.
      - name: Format
        working-directory: terraform/gcp
        run: terraform fmt -check -recursive -diff

      - name: Init
        working-directory: terraform/gcp
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: terraform/gcp
        run: terraform validate
